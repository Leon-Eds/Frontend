<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#003f27" />
  <title>LeonEd — Offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      background: #fbf7f0; color: #0f2219; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { color: #3c4d44; margin: 0 0 24px; line-height: 1.6; max-width: 340px; }
    button { height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: #b05d1c; color: #fff;
      font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="LeonEd" />
    <h1>You're offline</h1>
    <p>LeonEd needs an internet connection. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
